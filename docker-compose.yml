services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fakturujto
      POSTGRES_PASSWORD: fakturujto
      POSTGRES_DB: fakturujto
    ports:
      - "5432:5432"
    volumes:
      - fakturujto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakturujto -d fakturujto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://fakturujto:fakturujto@db:5432/fakturujto
      JWT_SECRET: change-me-in-production-min-16-chars
      PORT: "3001"
      CORS_ORIGIN: "*"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  fakturujto_pg:
